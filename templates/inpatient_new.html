{% extends "base.html" %}
{% block title %}Admit Patient — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Admit Patient</h1></div></div>

<div class="card" style="margin-bottom:16px;">
  <div class="field">
    <label>Search Patient (Name, Patient ID, Owner Name, or Owner Phone)</label>
    <input type="text" id="patientSearch" autocomplete="off" placeholder="Start Typing…">
  </div>
  <div id="searchResults" style="margin-top:10px;"></div>
</div>

<div class="card" id="formCard" style="display:{{ 'block' if selected_patient_id else 'none' }};">
  <p class="small muted" style="margin-bottom:14px;">Patient: <strong id="selectedPatientLabel">{{ selected_patient_label or '' }}</strong></p>
  <form method="post" data-track-unsaved>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="patient_id" id="patientIdField" value="{{ selected_patient_id or '' }}">
    <div class="form-grid">
      <div class="field"><label>Admission Date</label><input required type="date" name="admission_date" value="{{ fv(form, 'admission_date', today) }}"></div>
      <div class="field"><label>Weight (KG)</label><input type="number" step="0.1" min="0" name="weight_kg" value="{{ fv(form, 'weight_kg') }}"></div>
      <div class="field"><label>BCS (1–9)</label><input type="number" step="1" min="1" max="9" name="bcs" value="{{ fv(form, 'bcs') }}"></div>
      <div class="field"><label>Attending Veterinarian</label>
        <select name="attending_vet_id"><option value="">—</option>{% for v in vets %}<option value="{{ v.id }}" {{ 'selected' if fv(form, 'attending_vet_id')==v.id }}>{{ v.full_name }}</option>{% endfor %}</select>
      </div>
      <div class="field"><label>Supervising Veterinarian</label>
        <select name="supervising_vet_id"><option value="">—</option>{% for v in vets %}<option value="{{ v.id }}" {{ 'selected' if fv(form, 'supervising_vet_id')==v.id }}>{{ v.full_name }}</option>{% endfor %}</select>
      </div>
      <div class="field full"><label>Presenting Complaint</label><input name="complaint" value="{{ fv(form, 'complaint') }}"></div>
      <div class="field full"><label>Physical Exam Findings &amp; Diagnostics</label><textarea name="exam_findings">{{ fv(form, 'exam_findings') }}</textarea></div>
      <div class="field full"><label>Admitted Items (Leash, Carrier, Etc.)</label><input name="admitted_items" value="{{ fv(form, 'admitted_items') }}"></div>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">Admit</button>
      <a class="btn secondary" href="{{ url_for('inpatient_list') }}">Cancel</a>
    </div>
  </form>
</div>

<script>
const searchInput = document.getElementById('patientSearch');
const resultsDiv = document.getElementById('searchResults');
let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length === 0) { resultsDiv.innerHTML = ''; return; }
  if (q.length < 2) { resultsDiv.innerHTML = '<div class="empty-note">Type at least 2 characters.</div>'; return; }
  debounceTimer = setTimeout(() => {
    fetch(`/api/patients/search?q=${encodeURIComponent(q)}`)
      .then(r => r.json())
      .then(data => {
        if (!data.length) { resultsDiv.innerHTML = '<div class="empty-note">No matches.</div>'; return; }
        window.__inpatientSearchResults = data;
        resultsDiv.innerHTML = data.map((p, idx) =>
          `<div class="list-line" style="cursor:pointer;" data-idx="${idx}" onclick="selectPatient(window.__inpatientSearchResults[this.dataset.idx])">
             <div><div class="who">${escapeHtml(p.animal_name)} <span class="meta">(${escapeHtml(p.species || '')})</span></div>
             <div class="meta">Owner: ${escapeHtml(p.owner_name)} · ${escapeHtml(p.owner_phone || 'no phone')} · ${escapeHtml(p.id)}</div></div>
           </div>`
        ).join('');
      })
      .catch(() => { resultsDiv.innerHTML = '<div class="empty-note">Could not search patients; check server connection.</div>'; });
  }, 200);
});
function selectPatient(p) {
  document.getElementById('patientIdField').value = p.id;
  document.getElementById('selectedPatientLabel').textContent = `${p.animal_name} — ${p.owner_name} (${p.id})`;
  document.getElementById('formCard').style.display = 'block';
  resultsDiv.innerHTML = '';
  searchInput.value = '';
}
</script>
<script src="{{ url_for('static', filename='unsaved-changes-form.js') }}"></script>
{% endblock %}
