{% extends "base.html" %}
{% block title %}{{ _('Admit Patient') }} — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ _('Admit Patient') }}</h1></div></div>

<div class="card" style="margin-bottom:16px;">
  <div class="field">
    <label for="patientSearch">{{ _('Search Patient (Name, Patient ID, Owner Name, or Owner Phone)') }}</label>
    <input type="text" id="patientSearch" autocomplete="off" placeholder="{{ _('Start Typing…') }}">
  </div>
  <div id="searchResults" style="margin-top:10px;"></div>
</div>

<div class="card" id="formCard" style="display:{{ 'block' if selected_patient_id else 'none' }};">
  <p class="small muted" style="margin-bottom:14px;">{{ _('Patient:') }} <strong id="selectedPatientLabel">{{ selected_patient_label or '' }}</strong></p>
  <form method="post" data-track-unsaved>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="patient_id" id="patientIdField" value="{{ selected_patient_id or '' }}">
    <div class="form-grid">
      <div class="field"><label for="inpatientnew-1-admission_date">{{ _('Admission Date') }}</label><input id="inpatientnew-1-admission_date" required type="date" name="admission_date" value="{{ fv(form, 'admission_date', today) }}"></div>
      <div class="field"><label for="inpatientnew-2-weight_kg">{{ _('Weight (KG)') }}</label><input id="inpatientnew-2-weight_kg" type="number" step="0.1" min="0" name="weight_kg" value="{{ fv(form, 'weight_kg') }}"></div>
      <div class="field"><label for="inpatientnew-3-bcs">{{ _('BCS (1–9)') }}</label><input id="inpatientnew-3-bcs" type="number" step="1" min="1" max="9" name="bcs" value="{{ fv(form, 'bcs') }}"></div>
      <div class="field"><label for="inpatientnew-4-attending_vet_id">{{ _('Attending Veterinarian') }}</label>
        <select id="inpatientnew-4-attending_vet_id" name="attending_vet_id"><option value="">—</option>{% for v in vets %}<option value="{{ v.id }}" {{ 'selected' if fv(form, 'attending_vet_id')==v.id }}>{{ v.full_name }}</option>{% endfor %}</select>
      </div>
      <div class="field"><label for="inpatientnew-5-supervising_vet_id">{{ _('Supervising Veterinarian') }}</label>
        <select id="inpatientnew-5-supervising_vet_id" name="supervising_vet_id"><option value="">—</option>{% for v in vets %}<option value="{{ v.id }}" {{ 'selected' if fv(form, 'supervising_vet_id')==v.id }}>{{ v.full_name }}</option>{% endfor %}</select>
      </div>
      <div class="field full"><label for="inpatientnew-6-complaint">{{ _('Presenting Complaint') }}</label><input id="inpatientnew-6-complaint" name="complaint" value="{{ fv(form, 'complaint') }}"></div>
      <div class="field full"><label for="inpatientnew-7-exam_findings">{{ _('Physical Exam Findings & Diagnostics') }}</label><textarea id="inpatientnew-7-exam_findings" name="exam_findings">{{ fv(form, 'exam_findings') }}</textarea></div>
      <div class="field full"><label for="inpatientnew-8-admitted_items">{{ _('Admitted Items (Leash, Carrier, Etc.)') }}</label><input id="inpatientnew-8-admitted_items" name="admitted_items" value="{{ fv(form, 'admitted_items') }}"></div>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">{{ _('Admit') }}</button>
      <a class="btn secondary" href="{{ url_for('clinical.inpatient_list') }}">{{ _('Cancel') }}</a>
    </div>
  </form>
</div>

<script nonce="{{ csp_nonce }}">
const searchInput = document.getElementById('patientSearch');
const resultsDiv = document.getElementById('searchResults');
let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length === 0) { resultsDiv.innerHTML = ''; return; }
  if (q.length < 2) { resultsDiv.innerHTML = '<div class="empty-note">' + {{ _('Type at least 2 characters.')|tojson }} + '</div>'; return; }
  debounceTimer = setTimeout(() => {
    fetch(`{{ url_for('clinical.api_patients_search') }}?q=${encodeURIComponent(q)}`)
      .then(r => r.json())
      .then(data => {
        if (!data.length) { resultsDiv.innerHTML = '<div class="empty-note">' + {{ _('No matches.')|tojson }} + '</div>'; return; }
        window.__inpatientSearchResults = data;
        resultsDiv.innerHTML = data.map((p, idx) =>
          `<div class="list-line" style="cursor:pointer;" data-idx="${idx}" data-vz-act="inpatient-new-1">
             <div><div class="who">${escapeHtml(p.animal_name)} <span class="meta">(${escapeHtml(p.species || '')})</span></div>
             <div class="meta">Owner: ${escapeHtml(p.owner_name)} · ${escapeHtml(p.owner_phone || {{ _('no phone')|tojson }})} · ${escapeHtml(p.id)}${p.microchip ? ' · Chip: ' + escapeHtml(p.microchip) : ''}</div></div>
           </div>`
        ).join('');
      })
      .catch(() => { resultsDiv.innerHTML = '<div class="empty-note">' + {{ _('Could not search patients; check server connection.')|tojson }} + '</div>'; });
  }, 200);
});
function selectPatient(p) {
  document.getElementById('patientIdField').value = p.id;
  document.getElementById('selectedPatientLabel').textContent = `${p.animal_name} — ${p.owner_name} (${p.id})`;
  document.getElementById('formCard').style.display = 'block';
  resultsDiv.innerHTML = '';
  searchInput.value = '';
}
</script>
<script src="{{ url_for('static', filename='unsaved-changes-form.js') }}"></script>
<script nonce="{{ csp_nonce }}">
VZ.action('inpatient-new-1', function (event) { selectPatient(window.__inpatientSearchResults[this.dataset.idx]); });
</script>
{% endblock %}
