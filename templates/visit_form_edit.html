{% extends "base.html" %}
{% block title %}Edit Visit — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Edit Visit</h1><p class="page-sub">{{ visit.id }}</p></div></div>
<div class="card">
<form method="post" data-track-unsaved>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% include "_visit_fields.html" %}

  <div class="section-title">Clinical Notes</div>
  <div class="form-grid">
    <div class="field"><label>Case Status</label>
      <select name="case_status">{% for s in case_statuses %}<option {{ 'selected' if visit.case_status==s }}>{{ s }}</option>{% endfor %}</select>
    </div>
    <div class="field"><label>Visit Type</label>
      <select name="visit_type">{% for t in ['Outpatient','Inpatient'] %}<option {{ 'selected' if visit.visit_type==t }}>{{ t }}</option>{% endfor %}</select>
    </div>
    <div class="field full"><label>Presenting Complaint</label><input name="complaint" value="{{ visit.complaint or '' }}"></div>
    <div class="field full"><label>History</label><textarea name="history">{{ visit.history or '' }}</textarea></div>
    <div class="field full"><label>Physical Exam &amp; Diagnostics</label><textarea name="exam">{{ visit.exam or '' }}</textarea></div>
    <div class="field full"><label>Treatment Plan</label><textarea name="treatment">{{ visit.treatment or '' }}</textarea></div>
    <div class="field full"><label>Updates Log</label><textarea name="updates_log" rows="4">{{ visit.updates_log or '' }}</textarea></div>
  </div>

  <div class="section-title">Follow-Up</div>
  <div class="form-grid">
    <div class="field">
      <label>Follow-Up Needed?</label>
      <select name="followup_needed" id="followupNeeded" onchange="toggleFollowup()">
        <option value="N" {{ 'selected' if visit.followup_needed=='N' }}>No</option>
        <option value="Y" {{ 'selected' if visit.followup_needed=='Y' }}>Yes</option>
      </select>
    </div>
    <div class="field followup-only"><label>Follow-Up Status</label>
      <select name="followup_status">{% for s in ['Pending','Completed','Cancelled','N/A'] %}<option {{ 'selected' if visit.followup_status==s }}>{{ s }}</option>{% endfor %}</select>
    </div>
    <div class="field followup-only"><label>Follow-Up Method</label>
      <select name="followup_method"><option value="">—</option>{% for t in ['Physical Visit','Phone Call'] %}<option {{ 'selected' if visit.followup_method==t }}>{{ t }}</option>{% endfor %}</select>
    </div>
    <div class="field followup-only"><label>Reason</label>
      <select name="followup_reason"><option value="">—</option>{% for r in followup_reasons %}<option {{ 'selected' if visit.followup_reason==r }}>{{ r }}</option>{% endfor %}</select>
    </div>
    <div class="field followup-only"><label>Follow-Up Date</label><input type="date" name="followup_date" value="{{ visit.followup_date or '' }}"></div>
  </div>

  {% if visit.grooming_needed == 'Y' %}
  <div class="section-title">Grooming Status</div>
  <div class="form-grid">
    <div class="field"><label>Status</label>
      <select name="grooming_status">{% for s in ['Waiting','Ongoing','Finished'] %}<option {{ 'selected' if visit.grooming_status==s }}>{{ s }}</option>{% endfor %}</select>
    </div>
    <div class="field"><label>Contacted?</label>
      <select name="grooming_contacted"><option value="N" {{ 'selected' if visit.grooming_contacted=='N' }}>No</option><option value="Y" {{ 'selected' if visit.grooming_contacted=='Y' }}>Yes</option></select>
    </div>
  </div>
  {% endif %}

  <div class="form-actions">
    <button class="btn" type="submit">Save Changes</button>
    <a class="btn secondary" href="{{ url_for('visit_detail', visit_id=visit.id) }}">Cancel</a>
  </div>
</form>
</div>
<script>
function toggleFollowup() {
  const needed = document.getElementById('followupNeeded').value === 'Y';
  document.querySelectorAll('.followup-only').forEach(el => el.style.display = needed ? 'flex' : 'none');
}
toggleFollowup();
</script>
<script src="{{ url_for('static', filename='unsaved-changes-form.js') }}"></script>
{% endblock %}
