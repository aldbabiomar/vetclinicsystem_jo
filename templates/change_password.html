{% extends "base.html" %}
{% block title %}Change Password — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Change Password</h1>
    {% if forced %}<p class="page-sub">You need to set a new password before continuing.</p>{% endif %}
  </div>
</div>
<div class="card" style="max-width:420px;">
  <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field" style="margin-bottom:14px;"><label>Current Password</label><input type="password" name="current_password" required></div>
    <div class="field" style="margin-bottom:14px;"><label>New Password</label><input type="password" name="new_password" required minlength="8"></div>
    <div class="field" style="margin-bottom:18px;"><label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="8"></div>
    <button class="btn" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
