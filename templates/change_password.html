{% extends "base.html" %}
{% block title %}{{ _('Change Password') }} — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ _('Change Password') }}</h1>
    {% if forced %}<p class="page-sub">{{ _('You need to set a new password before continuing.') }}</p>{% endif %}
  </div>
</div>
<div class="card" style="max-width:420px;">
  <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field" style="margin-bottom:14px;"><label for="changepassword-1-current_password">{{ _('Current Password') }}</label><input id="changepassword-1-current_password" type="password" name="current_password" autocomplete="current-password" required></div>
    <div class="field" style="margin-bottom:14px;"><label for="changepassword-2-new_password">{{ _('New Password') }}</label><input id="changepassword-2-new_password" type="password" name="new_password" autocomplete="new-password" required minlength="8"></div>
    <div class="field" style="margin-bottom:18px;"><label for="changepassword-3-confirm_password">{{ _('Confirm New Password') }}</label><input id="changepassword-3-confirm_password" type="password" name="confirm_password" autocomplete="new-password" required minlength="8"></div>
    <button class="btn" type="submit">{{ _('Update Password') }}</button>
  </form>
</div>
{% endblock %}
