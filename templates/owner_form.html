{% extends "base.html" %}
{% block title %}{{ 'Edit Owner' if owner else 'New Owner' }} — {{ clinic_name }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ 'Edit Owner' if owner else 'New Owner' }}</h1></div></div>
<div class="card">
<form method="post" data-track-unsaved>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="field"><label for="ownerform-1-name">Name</label><input id="ownerform-1-name" required name="name" value="{{ fv(form, 'name', owner.name if owner else '') }}"></div>
    <div class="field"><label for="ownerform-2-phone">Phone</label><input id="ownerform-2-phone" name="phone" value="{{ fv(form, 'phone', owner.phone if owner else '') }}" data-phone-field></div>
    <div class="field full"><label for="ownerform-3-address">Address</label><input id="ownerform-3-address" name="address" value="{{ fv(form, 'address', owner.address if owner else '') }}"></div>
    <div class="field full"><label for="ownerform-4-notes">Notes</label><textarea id="ownerform-4-notes" name="notes">{{ fv(form, 'notes', owner.notes if owner else '') }}</textarea></div>
  </div>
  <div class="form-actions">
    <button class="btn" type="submit">{{ 'Save Changes' if owner else 'Add Owner' }}</button>
    <a class="btn secondary" href="{{ url_for('owner_detail', owner_id=owner.id) if owner else url_for('owners_list') }}">Cancel</a>
  </div>
</form>
</div>
<script src="{{ url_for('static', filename='unsaved-changes-form.js') }}"></script>
<script src="{{ url_for('static', filename='phone-validate.js') }}"></script>
{% endblock %}
