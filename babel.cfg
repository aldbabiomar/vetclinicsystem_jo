# Root-level modules and the blueprints, plus every template.
# `*.py` rather than `**.py` deliberately: `**` would also sweep tests/, whose
# fixture strings are not user-facing and would pollute the catalogue. Any new
# top-level module or blueprint is picked up automatically; a new subpackage
# would need a line here, and the symptom of forgetting is an untranslated
# string (visible), not a silent failure.
[python: *.py]
[python: routes/*.py]
[jinja2: templates/**.html]
